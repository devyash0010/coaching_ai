server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single Page App: let the client-side router handle deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html must not be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
